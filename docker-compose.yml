version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/autonomous_agent?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - BREETH_API_KEY=${BREETH_API_KEY}
      - BREETH_BASE_URL=${BREETH_BASE_URL:-https://api.breeth.ai}
      - AGENT_DISCOVERY_INTERVAL_MINUTES=15
      - AGENT_MIN_PUBLISH_INTERVAL_MINUTES=120
      - AGENT_MAX_POSTS_PER_DAY=6
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: autonomous_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
